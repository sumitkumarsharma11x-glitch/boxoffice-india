name: Sync movie data from Google Sheet

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Convert Sheet CSV to movies.json
        env:
          MOVIES_CSV_URL: ${{ secrets.MOVIES_CSV_URL }}
        run: python scripts/csv_to_movies.py

      - name: Commit updated movie data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/movies.json
          if git diff --cached --quiet; then
            echo "No movie-data changes."
          else
            git commit -m "Update movie data from Google Sheet"
            git push
          fi
